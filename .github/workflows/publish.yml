# Fork-friendly release.
#
# Ships the desktop app: it creates a GitHub Release in THIS repository and then
# hands packaging over to publish-desktop.yml (channel `prod`), which builds the
# Windows and Linux installers and attaches them to that release.
#
# The CLI build from the upstream workflow is gone on purpose: the desktop app
# embeds the server built from packages/opencode, so the CLI archives were dead
# weight. The rest of upstream's workflow is dropped too, because it depends on
# resources this fork does not own:
#   - Windows code signing (Azure Trusted Signing)
#   - macOS packaging (Apple certificates for notarization)
#   - `./script/publish.ts` (npm publish of `opencode-ai`, ghcr.io image, AUR,
#     Homebrew tap) — those names belong to the upstream project
#
# Version input is optional: an empty value bumps the patch of the latest
# release in this repository.

name: publish
run-name: "${{ format('release {0}', inputs.version || github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.124 (empty = bump patch of the latest release)"
        required: false
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  # Uncomment to release on every push to a branch (each push creates a release).
  # push:
  #   branches:
  #     - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Tags are needed for `gh release create --generate-notes`.
          fetch-depth: 0

      - name: Create release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$version" ]; then
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' || true)
            base="${latest#v}"
            base="${base%%-*}"
            base="${base%%+*}"
            if [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS=. read -r major minor patch <<< "$base"
              version="${major}.${minor}.$((patch + 1))"
            else
              # No usable release yet — start from 0.0.1 and bump from there.
              version="0.0.1"
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Not a valid version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it"
          else
            args=(--title "$tag" --target "$GITHUB_SHA" --generate-notes)
            if [ "$INPUT_DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$tag" "${args[@]}"
          fi

          release=$(gh release view "$tag" --json databaseId --jq .databaseId)
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Releasing **${{ steps.version.outputs.tag }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Desktop installers land in the release once \`build-desktop\` finishes. Draft releases must be published manually (or re-run with \`draft: false\`)." >> "$GITHUB_STEP_SUMMARY"

  build-desktop:
    needs: version
    permissions:
      contents: write
    # `prod` is the channel releases use; the packaging matrix itself lives in
    # publish-desktop.yml so a release and a manual desktop run cannot drift.
    uses: ./.github/workflows/publish-desktop.yml
    with:
      channel: prod
      tag: ${{ needs.version.outputs.tag }}
      # publish.yml owns the release state through its own `draft` input.
      prerelease: false
