# Fork-friendly release.
#
# Builds the CLI for every supported platform (the OfficeCLI binary is vendored
# into each artifact by packages/opencode/script/build.ts) and attaches the
# archives to a GitHub Release in THIS repository.
#
# Deliberately dropped from the upstream workflow, because they all depend on
# resources this fork does not own:
#   - Windows code signing (Azure Trusted Signing)
#   - the desktop/Electron matrix (Apple certificates, Tauri keys)
#   - `./script/publish.ts` (npm publish of `opencode-ai`, ghcr.io image, AUR,
#     Homebrew tap) — those names belong to the upstream project
#
# Version input is optional: an empty value bumps the patch of the latest
# release in this repository. The channel is pinned to `latest` so the build
# produces real (non-preview) artifacts instead of `0.0.0-<branch>-<timestamp>`.

name: publish
run-name: "${{ format('release {0}', inputs.version || github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.124 (empty = bump patch of the latest release)"
        required: false
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  # Uncomment to release on every push to a branch (each push creates a release).
  # push:
  #   branches:
  #     - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Tags are needed for `gh release create --generate-notes`.
          fetch-depth: 0

      - name: Create release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$version" ]; then
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' || true)
            base="${latest#v}"
            base="${base%%-*}"
            base="${base%%+*}"
            if [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS=. read -r major minor patch <<< "$base"
              version="${major}.${minor}.$((patch + 1))"
            else
              # No usable release yet — start from 0.0.1 and bump from there.
              version="0.0.1"
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Not a valid version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it"
          else
            args=(--title "$tag" --target "$GITHUB_SHA" --generate-notes)
            if [ "$INPUT_DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$tag" "${args[@]}"
          fi

          release=$(gh release view "$tag" --json databaseId --jq .databaseId)
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Releasing **${{ steps.version.outputs.tag }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts land in the release once \`build-cli\` finishes. Draft releases must be published manually (or re-run with \`draft: false\`)." >> "$GITHUB_STEP_SUMMARY"

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Build
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          # `latest` = real release (not the `0.0.0-<branch>-<date>` preview version).
          OPENCODE_CHANNEL: latest
          # Non-empty makes build.ts tar/zip the artifacts and upload them to the release.
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # Optional overrides for the vendored OfficeCLI binary:
          #   OPENCODE_SKIP_OFFICECLI: "1"
          #   OPENCODE_OFFICECLI_VERSION: "1.0.123"
        run: ./packages/opencode/script/build.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli
          path: packages/opencode/dist/opencode-*
