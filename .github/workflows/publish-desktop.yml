# Desktop packaging.
#
# Upstream builds this matrix inside its own release workflow, which depends on
# resources the fork does not own. This workflow keeps the parts that build
# without them and is the single implementation of desktop packaging:
#   - Windows: nsis installer (.exe). script/sign-windows.ps1 exits early when the
#     Azure Trusted Signing variables are unset, so the installer is unsigned.
#   - Linux: deb, plus AppImage and rpm, the other targets listed in
#     packages/desktop/electron-builder.config.ts.
#   - macOS is deliberately absent: its config needs Apple certificates for
#     notarization.
#
# Both architectures are cross-compiled from the x64 hosted runners —
# electron-builder downloads the matching Electron build — so no ARM runner is
# needed.
#
# The `offline` job below is the exception: every npm and toolchain component of
# the air-gapped bundle is host specific, so each target is built on a matching
# runner (ubuntu-latest, ubuntu-24.04-arm, windows-latest) rather than crossed.
# It ships the runtime downloads opencode would otherwise fetch on first use
# (language servers, ripgrep, model catalog) as opencode-offline-<platform>-<arch>.tar.gz.
#
# Two ways in:
#   - `workflow_dispatch`: pick a channel, optionally pass `tag` to create/attach
#     a release, `prerelease` marks it as one.
#   - `workflow_call`: publish.yml owns the release and calls this workflow with
#     `channel: prod` and the tag it just created, so a release ships these
#     installers instead of a CLI build.
#
# Channel notes:
#   - prod and beta bundle the CLI that packages/cli/script/build.ts produces:
#     prebuild copies it to resources/opencode-cli, and packaging fails without it.
#     Each package entry builds it for its own architecture, because the runners are
#     x64 while electron-builder cross-compiles the app.
#   - dev bundles a CLI downloaded from npm at the version pinned in
#     packages/desktop/scripts/utils.ts, which is no longer published.
#
# Nothing is signed and electron-builder never publishes (--publish never).

name: publish-desktop
run-name: "desktop ${{ inputs.channel }} ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Desktop channel (dev bundles a CLI from npm and currently cannot resolve its pinned version)"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - beta
          - dev
      tag:
        description: "Release tag to create or attach to, e.g. v1.0.124 (empty = run artifacts only)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: true
        type: boolean
  # Called by publish.yml: `prerelease` stays false because the caller already
  # decided the release state from its own `draft` input.
  workflow_call:
    inputs:
      channel:
        description: "Desktop channel; releases use prod"
        required: false
        default: prod
        type: string
      tag:
        description: "Release tag that publish.yml created (empty = run artifacts only)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

# Deliberately not `${{ github.workflow }}-${{ github.ref }}`: when publish.yml
# calls this workflow its own lock is already held, so a shared group name could
# queue the call behind the run that started it.
concurrency: publish-desktop-${{ github.ref }}

permissions:
  contents: write

jobs:
  # Runs before the matrix so the four jobs upload to one release instead of
  # racing to create it. When publish.yml calls this workflow the release
  # already exists, so the step below only updates the pre-release flag.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # --generate-notes needs the tag history.
          fetch-depth: 0

      - name: Ensure release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "--prerelease=$PRERELEASE"
          else
            args=(--target "$GITHUB_SHA" --generate-notes "--prerelease=$PRERELEASE")
            gh release create "$TAG" "${args[@]}"
          fi

  package:
    needs: release
    # `cli_package` is the distribution packages/cli/script/build.ts writes for this
    # entry, and `cli_target` is the identity the desktop resolves it by. They differ
    # for arm64: the runners are x64, so without OPENCODE_CLI_TARGET the app would
    # bundle an x64 CLI into an arm64 installer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            name: opencode-desktop-windows-x64
            cli_package: opencode-windows-x64-baseline
            cli_target: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: win
            arch: arm64
            name: opencode-desktop-windows-arm64
            cli_package: opencode-windows-arm64
            cli_target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            name: opencode-desktop-linux-x64
            cli_package: opencode-linux-x64-baseline
            cli_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            name: opencode-desktop-linux-arm64
            cli_package: opencode-linux-arm64
            cli_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # electron-builder builds rpm through fpm, which shells out to rpmbuild.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      # Upstream generates this directory from a Rust napi module (macOS window
      # helper plus swift-build). The fork does not ship it and win/linux never
      # load it, but electron-builder.config.ts lists it as an extra resource and
      # needs the source directory to exist.
      - name: Create native resource directory
        shell: bash
        run: mkdir -p packages/desktop/native

      # The desktop ships the CLI binary as resources/opencode-cli and refuses to
      # package without it, so prod/beta need a built distribution. Building it here
      # is what lets the four architectures run in parallel; --target selects the
      # binary that matches the app electron-builder is about to cross-compile.
      - name: Build CLI distribution
        if: inputs.channel != 'dev'
        working-directory: packages/cli
        shell: bash
        env:
          # "latest" is the only channel name service discovery agrees on. Any other
          # one renames the registration file (service-<channel>.json) and moves the
          # default port, so the packaged app would never find the service it started.
          OPENCODE_CHANNEL: latest
          OPENCODE_TAG: ${{ inputs.tag }}
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          set -euo pipefail

          # A bundled CLI needs a release version rather than a preview one, so prefer
          # the tag being released and fall back to the version in the source tree.
          version="${OPENCODE_TAG:-}"
          version="${version#v}"
          if [ -z "$version" ]; then
            version="$(grep -m1 '"version"' package.json | cut -d'"' -f4)"
          fi

          OPENCODE_VERSION="$version" bun run script/build.ts --target=${{ matrix.cli_package }}

      # Copies the channel icons/metainfo into resources/ and stages the CLI binary
      # the packager requires.
      - name: Prepare desktop resources
        run: bun run --cwd packages/desktop prebuild
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
          OPENCODE_CLI_TARGET: ${{ matrix.cli_target }}

      - name: Build desktop assets
        run: bun run --cwd packages/desktop build
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}

      # --publish never keeps electron-builder away from the GitHub release config
      # in electron-builder.config.ts, which points at the upstream repository.
      - name: Package ${{ matrix.arch }}
        run: bun run --cwd packages/desktop package:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}

      # Kylin V10 SP1 desktop is an Ubuntu 20.04 base: dpkg, glibc 2.31, GTK 3 and
      # a hicolor/pixmaps icon lookup. Inspect the deb instead of trusting the
      # packager, because a missing icon or a glibc built past 2.31 only shows up
      # on the target machine.
      - name: Verify deb installability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          debs=(packages/desktop/dist/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::no deb was produced"
            exit 1
          fi
          deb="${debs[0]}"

          echo "== $(basename "$deb") $(dpkg-deb -f "$deb" Architecture)"
          dpkg-deb -f "$deb" Depends

          stage="$(mktemp -d)"
          dpkg-deb -x "$deb" "$stage"

          launcher="$(find "$stage/usr/share/applications" -name '*.desktop' ! -name 'opencode-desktop.desktop' | head -n 1)"
          if [ -z "$launcher" ]; then
            echo "::error::deb installs no desktop entry"
            exit 1
          fi
          if ! grep -q '^Icon=' "$launcher"; then
            echo "::error::desktop entry has no Icon"
            exit 1
          fi
          grep -E '^(Exec|Icon|StartupWMClass)=' "$launcher"

          # A product name with a space produces an Exec path that is split in two.
          launcher_exec="$(sed -n 's/^Exec=//p' "$launcher" | head -n 1)"
          launcher_exec="${launcher_exec%% *}"
          if [ ! -f "$stage$launcher_exec" ]; then
            echo "::error::Exec target $launcher_exec is not installed by the deb"
            exit 1
          fi

          icons="$(find "$stage/usr/share/icons/hicolor" -name '*.png' | wc -l)"
          echo "hicolor icons: $icons"
          if [ "$icons" -eq 0 ]; then
            echo "::error::deb installs no hicolor icon"
            exit 1
          fi
          pixmaps="$(find "$stage/usr/share/pixmaps" -name '*.png' | wc -l)"
          if [ "$pixmaps" -eq 0 ]; then
            echo "::error::deb installs no pixmaps fallback icon"
            exit 1
          fi

          binary="$(find "$stage/opt" -maxdepth 2 -type f -name 'ai.opencode.desktop*' | head -n 1)"
          if [ -z "$binary" ]; then
            echo "::error::deb installs no application binary under /opt"
            exit 1
          fi
          required="$(objdump -T "$binary" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)"
          required="${required#GLIBC_}"
          echo "highest glibc symbol needed: ${required:-none}"
          if [ -n "$required" ] && [ "$(printf '%s\n%s\n' 2.31 "$required" | sort -V | tail -n 1)" != "2.31" ]; then
            echo "::warning::bundled Electron needs glibc $required but Kylin V10 SP1 ships 2.31"
          fi

          rm -rf "$stage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-${{ inputs.channel }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.rpm

      - name: Attach to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(packages/desktop/dist/*.exe packages/desktop/dist/*.deb packages/desktop/dist/*.AppImage packages/desktop/dist/*.rpm)
          gh release upload "$TAG" "${files[@]}" --clobber

  # Air-gapped payload for the desktop channel: mirrors the runtime cache layout,
  # so the target host only extracts it into <cache>/opencode and runs opencode
  # with OPENCODE_OFFLINE=1. Built per target on a matching runner because the
  # npm and toolchain components use host specific .bin shims (`--allow-cross`
  # would silently drop all fifteen of them).
  offline:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
            name: offline-linux-x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            name: offline-linux-arm64
          - os: windows-latest
            target: win32
            arch: x64
            name: offline-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Deliberately not the shared setup-bun action: the bundler only needs a
      # runtime, and its workspace install is slow (and unproven) on arm64.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Report.txt records every component that was staged, skipped or is
      # path-only, so it ships next to the archive.
      - name: Build offline bundle
        working-directory: packages/cli
        env:
          # Release lookups go through the GitHub API, which answers anonymously at
          # only 60 requests per hour per IP. Hosted runners share that pool, so
          # without a token the build can 403 before staging anything.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run script/offline/build.ts --platform ${{ matrix.target }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-${{ inputs.channel }}
          if-no-files-found: error
          path: |
            packages/cli/dist/offline/opencode-offline-*.tar.gz
            packages/cli/dist/offline/REPORT.txt

      - name: Attach to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(packages/cli/dist/offline/opencode-offline-*.tar.gz)
          gh release upload "$TAG" "${files[@]}" --clobber

