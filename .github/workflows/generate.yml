name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Upstream commits generated code with its GitHub App. Forks have no app
      # credentials, so fall back to the workflow token that the checkout action
      # already persisted and `contents: write` authorizes.
      - name: Setup git committer (app)
        id: committer
        if: ${{ vars.OPENCODE_APP_ID != '' }}
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Setup git committer (workflow token)
        if: ${{ vars.OPENCODE_APP_ID == '' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          # GitHub rejects workflow-token pushes that touch .github/workflows
          # (no `workflows` permission), and forks keep their own workflow files
          # anyway, so restore generated workflow changes instead of shipping them.
          if [ -z "${{ vars.OPENCODE_APP_ID }}" ]; then
            git checkout -- .github/workflows
            git clean -fdq .github/workflows
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
